name: Dependency refresh

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      AUTH_SECRET: build-only-secret-that-is-long-enough-for-compilation
      COORDINATOR_PASSWORD: build-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Resolve patched production dependencies
        run: |
          npm install next@16.3.0 eslint-config-next@16.3.0 drizzle-orm@^0.45.2
          npm install --save-dev shadcn@^4.1.0
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=high
          npm install

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build

      - name: Emit generated manifests
        run: |
          echo "::group::GENERATED_PACKAGE_JSON"
          base64 -w0 package.json
          echo
          echo "::endgroup::"
          echo "::group::GENERATED_PACKAGE_LOCK"
          base64 -w0 package-lock.json
          echo
          echo "::endgroup::"
